<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ダイエット完全管理</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { font-family:sans-serif; background:#f5f5f5; padding:10px;}
.card { background:#fff; padding:12px; margin-bottom:12px; border-radius:10px;}
input, button { padding:8px; margin:5px 0; font-size:16px;}
button { background:#007bff; color:#fff; border:none; border-radius:5px;}
img { width:100px; border-radius:8px; margin:5px;}
.flex { display:flex; flex-wrap:wrap;}
.small { font-size:12px; color:#555;}
</style>
</head>
<body>

<h2>ダイエット完全管理</h2>

<!-- 体重 -->
<div class="card">
  <h3>体重記録</h3>
  <input type="number" id="weight" placeholder="kg" step="0.1">
  <button onclick="addWeight()">記録</button>
</div>

<!-- グラフ -->
<div class="card">
  <canvas id="chart"></canvas>
</div>

<!-- 食事 -->
<div class="card">
  <h3>食事記録</h3>
  <input type="file" accept="image/*" capture="camera" onchange="loadImage(event)">
  <input type="number" id="calorie" placeholder="カロリー">
  <button onclick="addMeal()">追加</button>
  <div class="small">※写真→このチャットに送れば精度UP</div>
</div>

<!-- 食事一覧 -->
<div class="card">
  <h3>今日の食事</h3>
  <div id="meals"></div>
  <h4 id="totalCal"></h4>
</div>

<!-- 習慣 -->
<div class="card">
  <h3>習慣</h3>
  <button onclick="countHabit('walk')">8000歩</button>
  <button onclick="countHabit('food')">食事OK</button>
  <div id="habit"></div>
</div>

<!-- マイルストーン -->
<div class="card">
  <h3>進捗</h3>
  <div id="milestone"></div>
</div>

<script>
let weights = JSON.parse(localStorage.getItem('weights')||"[]");
let meals = JSON.parse(localStorage.getItem('meals')||"[]");
let habits = JSON.parse(localStorage.getItem('habits')||'{"walk":0,"food":0}');
let tempImg = "";

function today(){
  return new Date().toISOString().slice(0,10);
}

function addWeight(){
  let w = parseFloat(document.getElementById('weight').value);
  if(!w) return;
  weights.push(w);
  localStorage.setItem('weights', JSON.stringify(weights));
  drawChart();
  updateMilestone();
}

function loadImage(e){
  let reader = new FileReader();
  reader.onload = ev => tempImg = ev.target.result;
  reader.readAsDataURL(e.target.files[0]);
}

function addMeal(){
  let cal = parseInt(document.getElementById('calorie').value);
  if(!tempImg || !cal) return;
  meals.push({date:today(), img:tempImg, cal:cal});
  localStorage.setItem('meals', JSON.stringify(meals));
  tempImg="";
  document.getElementById('calorie').value="";
  showMeals();
}

function showMeals(){
  let div = document.getElementById('meals');
  let todayMeals = meals.filter(m=>m.date===today());
  let total=0;
  div.innerHTML="";
  todayMeals.forEach(m=>{
    total+=m.cal;
    div.innerHTML += `<img src="${m.img}"><span>${m.cal}kcal</span><br>`;
  });
  document.getElementById('totalCal').innerText = "合計："+total+" kcal";
}

function countHabit(type){
  habits[type]++;
  localStorage.setItem('habits', JSON.stringify(habits));
  updateHabit();
}

function updateHabit(){
  document.getElementById('habit').innerText =
    `歩:${habits.walk}日 食事:${habits.food}日`;
}

function updateMilestone(){
  let current = weights[weights.length-1]||92.3;
  let text="";
  text += current<=85?"85kg達成<br>":"85kgまで"+(current-85).toFixed(1)+"kg<br>";
  text += current<=80?"80kg達成<br>":"80kgまで"+(current-80).toFixed(1)+"kg<br>";
  text += current<=75?"ゴール達成":"75kgまで"+(current-75).toFixed(1)+"kg";
  document.getElementById('milestone').innerHTML=text;
}

let chart;
function drawChart(){
  let labels = weights.map((_,i)=>i+1);
  let start=92.3, target=75;
  let goal = labels.map((_,i)=> start - ((start-target)/60)*i);

  if(chart) chart.destroy();
  chart = new Chart(document.getElementById('chart'),{
    type:'line',
    data:{
      labels:labels,
      datasets:[
        {label:"体重", data:weights},
        {label:"理想", data:goal, borderDash:[5,5]}
      ]
    }
  });
}

showMeals();
updateHabit();
updateMilestone();
drawChart();
</script>

</body>
</html>
